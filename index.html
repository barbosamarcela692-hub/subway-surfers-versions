
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subway Surfers Versions</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101522;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#087ee5;
 padding:28px 15px;
 text-align:center;
 border-bottom:5px solid #ffd52a;
}
header h1{margin:0;font-size:27px}
header p{margin:10px 0 0}
main{padding:18px;max-width:650px;margin:auto}
h2{color:#ffd52a}
.card{
 background:#202c40;
 border:1px solid #344b68;
 border-radius:15px;
 padding:18px;
 margin:15px 0;
}
.cover{
 background:linear-gradient(135deg,#087ee5,#18c9a5);
 height:125px;
 border-radius:12px;
 display:grid;
 place-items:center;
 font-size:55px;
}
button{
 width:100%;
 padding:14px;
 border:0;
 border-radius:9px;
 background:#ffd52a;
 color:#172033;
 font-weight:bold;
 font-size:16px;
}
footer{text-align:center;padding:25px;color:#9eabc0}
</style>
</head>
<body>
<header>
<h1>🚇 SUBWAY SURFERS</h1>
<p>VERSIONS • Explore diferentes versões!</p>
</header>
<main>
<h2>🎮 Biblioteca de versões</h2>

<div class="card">
<div class="cover">🚇</div>
<h3>Subway Surfers Original</h3>
<p>A versão clássica do jogo.</p>
<button onclick="window.open('https://play.google.com/store/apps/details?id=com.kiloo.subwaysurf','_blank')">ACESSAR JOGO OFICIAL</button>
</div>

<div class="card">
<div class="cover">🎃</div>
<h3>Halloween</h3>
<p>Conheça a temática de Halloween.</p>
<button onclick="window.open('https://subwaysurfers.com/','_blank')">SAIBA MAIS</button>
</div>

<div class="card">
<div class="cover">❄️</div>
<h3>Winter Edition</h3>
<p>Explore a temática de inverno.</p>
<button onclick="window.open('https://subwaysurfers.com/','_blank')">SAIBA MAIS</button>
</div>

</main>
<footer>
Subway Surfers Versions<br>
Projeto independente de fãs.
</footer>
</body>
</html>
